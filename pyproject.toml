[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volfc"
version = "0.1.0"
description = "Walk-forward equity volatility forecasting: GARCH, HAR and LSTM, with VaR and volatility targeting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pasquale Alessandro Denora" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "arch>=6.2", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
lstm = ["torch>=2.2"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["volfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
